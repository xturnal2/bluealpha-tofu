name: Validate OpenTofu configurations

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.2"
      - run: tofu fmt -recursive -check -diff

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.2"
      - name: Validate all published templates and examples
        run: ./scripts/validate.sh
